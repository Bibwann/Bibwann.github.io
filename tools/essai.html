<!doctype html>
<meta charset="utf-8">
<title>Banc d'essai des démos</title>
<style>html,body{margin:0;background:#111}iframe{border:0;display:block;width:1280px;height:860px}</style>
<iframe id="f"></iframe>
<script>
   // Petit banc d'essai : charge une demo, joue une sequence de clics
   // decrite dans l'URL, puis laisse la page dans l'etat final pour la
   // capture. Usage : tools/essai.html?p=assets/showcase/nova-studio.html&c=sel1,sel2
   var q = new URLSearchParams(location.search);
   var f = document.getElementById('f');
   f.src = '../' + q.get('p');
   f.addEventListener('load', function () {
      var d = f.contentDocument;
      var pas = (q.get('c') || '').split('|').filter(Boolean);
      var i = 0;
      (function suivant() {
         if (i >= pas.length) { console.log('[test] sequence terminee (' + pas.length + ' pas)'); return; }
         var sel = pas[i++];
         var el = d.querySelector(sel);
         if (!el) { console.log('[test] INTROUVABLE : ' + sel); return; }
         el.click();
         console.log('[test] clic ' + i + ' : ' + sel);
         setTimeout(suivant, 220);
      })();
   });
</script>
