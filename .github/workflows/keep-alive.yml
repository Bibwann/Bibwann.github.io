# Keep-alive de Codex : un projet Supabase gratuit est mis en pause après
# 7 jours sans activité. Ce job appelle la fonction `ping()` de la base
# (supabase/schema.sql, § 4 bis) tous les 3 jours, ce qui compte comme
# activité sans lire aucune donnée.
#
# Secrets à créer dans Settings → Secrets and variables → Actions →
# New repository secret :
#   SUPABASE_URL       https://<ref>.supabase.co  (Project Settings → API)
#   SUPABASE_ANON_KEY  la clé anon / publishable  (Project Settings → API)
#
# ⚠ GitHub ne lance les workflows planifiés que depuis la branche par
#   défaut (main), et les désactive dans un dépôt public resté 60 jours
#   sans commit (un e-mail prévient avant). Si le job échoue, GitHub
#   envoie aussi un e-mail : c'est l'alerte « le projet est en pause ».
name: Keep-alive Codex

on:
  schedule:
    # */3 repart à 1 chaque mois : l'écart maximal est de 4 jours, sous
    # les 7 jours de Supabase.
    - cron: "0 6 */3 * *"
  workflow_dispatch: # bouton « Run workflow » pour tester à la main

# Le job n'a besoin d'aucun droit sur le dépôt.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping de la base Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL et SUPABASE_ANON_KEY manquants (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Ancienne clé anon (JWT « eyJ… ») : elle va aussi dans Authorization.
          # Nouvelle clé publishable (« sb_publishable_… ») : apikey seul.
          entetes=(-H "apikey: ${SUPABASE_ANON_KEY}" -H "Content-Type: application/json")
          case "$SUPABASE_ANON_KEY" in
            eyJ*) entetes+=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}") ;;
          esac
          reponse=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" "${entetes[@]}" -d '{}')
          echo "Réponse : ${reponse}"
          if [ "$reponse" != '"ok"' ]; then
            echo "::error::Réponse inattendue : le projet est peut-être en pause (dashboard Supabase → Restore)."
            exit 1
          fi
